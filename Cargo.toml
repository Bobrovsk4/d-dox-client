[package]
name = "d-dox-client"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "multipart",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17.2"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "rt"] }
